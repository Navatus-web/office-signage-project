<!DOCTYPE html>
<html>
<head>
  <title>Office Display</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    #stage { width: 100vw; height: 100vh; position: relative; }
    img, video { width: 100vw; height: 100vh; object-fit: contain; }
    .media-frame {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: black;
    }
    .media-frame.fade-enabled {
      transition: opacity 900ms ease-in-out;
      will-change: opacity;
    }
    .media-frame.active {
      opacity: 1;
    }
    .empty {
      color: #fff; font-family: Arial, sans-serif;
      display:flex; align-items:center; justify-content:center;
      height:100vh; opacity:0.9;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const stage = document.getElementById("stage");

    if (window.location.protocol === "file:") {
      stage.innerHTML = '<div class="empty">Opening player at http://localhost:3000/player...</div>';
      window.location.replace("http://localhost:3000/player");
    }

    if (typeof io !== "function") {
      stage.innerHTML = '<div class="empty">Open this player from <b style="margin-left:6px;">http://localhost:3000/player</b></div>';
      throw new Error("Socket.IO is unavailable. Open the player through the running server.");
    }

    const socket = io();
    socket.emit("register-player");

    let playlist = [];
    let syncState = null;
    let transitionEnabled = false;

    let currentIndex = 0;
    let nextTimer = null;
    let currentNode = null;
    let currentKind = null; // "image" | "video" | null
    let isPaused = false;
    const preloadCache = new Map();

    async function fetchPlaylist() {
      const res = await fetch("/api/playlist", { cache: "no-store" });
      playlist = await res.json();
      return playlist;
    }

    async function fetchSync() {
      const res = await fetch("/api/sync", { cache: "no-store" });
      syncState = await res.json();
      return syncState;
    }

    async function fetchSettings() {
      try {
        const res = await fetch("/api/settings/player", { cache: "no-store" });
        if (!res.ok) return null;
        const settings = await res.json();
        transitionEnabled = settings?.imageTransitionEnabled === true;
        return settings;
      } catch (err) {
        transitionEnabled = false;
        return null;
      }
    }

    function clearTimers() {
      if (nextTimer) clearTimeout(nextTimer);
      nextTimer = null;
    }

    function cacheBustedSrc(item) {
      const version = syncState?.playlistVersion || 1;
      const separator = item.src.includes("?") ? "&" : "?";
      return `${item.src}${separator}v=${version}`;
    }

    function getNextIndex(index) {
      if (!playlist.length) return -1;
      return (index + 1) % playlist.length;
    }

    function preloadItem(index) {
      if (index < 0 || !playlist[index]) return;

      const item = playlist[index];
      const src = cacheBustedSrc(item);

      if (preloadCache.has(src)) return;

      if (item.type === "image") {
        const img = new Image();
        img.src = src;
        preloadCache.set(src, img);
        return;
      }

      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = src;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        video.load();
        preloadCache.set(src, video);
      }
    }

    function trimPreloadCache() {
      if (preloadCache.size <= 12) return;
      const keys = [...preloadCache.keys()];
      keys.slice(0, preloadCache.size - 12).forEach((key) => preloadCache.delete(key));
    }

    function reportPlayerState(item) {
      if (!item || !item.src) return;
      socket.emit("player-state", {
        type: item.type,
        src: cacheBustedSrc(item),
        paused: isPaused
      });
    }

    function pausePlayback() {
      isPaused = true;
      clearTimers();
      if (currentKind === "video") {
        currentNode?.pause?.();
      }
      reportPlayerState(playlist[currentIndex]);
    }

    function resumePlayback() {
      if (!isPaused) return;
      isPaused = false;
      playFromSync();
    }

    function renderPausedFromSync() {
      isPaused = false;
      playFromSync();
      pausePlayback();
    }

    function cleanupCurrentNode() {
      if (currentNode) {
        currentNode.onended = null;
        currentNode.onerror = null;
        currentNode.onload = null;
        currentNode.onloadeddata = null;
        currentNode.pause?.();
        currentNode = null;
      }
    }

    function resetPlaybackState() {
      clearTimers();
      cleanupCurrentNode();
      currentKind = null;
      stage.innerHTML = "";
    }

    function showEmpty() {
      resetPlaybackState();
      stage.innerHTML = `<div class="empty">No media found in <b style="margin-left:6px;">/public/media</b></div>`;
    }

    // Build timeline using IMAGES ONLY for time-based sync
    // Videos are not time-synced here because they should play through naturally
    function buildImageTimeline() {
      const timeline = [];

      playlist.forEach((item, playlistIndex) => {
        if (item.type === "image") {
          timeline.push({
            ...item,
            playlistIndex,
            ms: item.duration || 7000
          });
        }
      });

      return timeline;
    }

    function computeImageIndexAndRemainder(timeline, elapsedMs) {
      const totalMs = timeline.reduce((sum, x) => sum + x.ms, 0);

      if (totalMs <= 0) {
        return { imageTimelineIndex: 0, remainingMs: null };
      }

      let t = elapsedMs % totalMs;

      for (let i = 0; i < timeline.length; i++) {
        const dur = timeline[i].ms;
        if (t < dur) {
          return {
            imageTimelineIndex: i,
            remainingMs: dur - t
          };
        }
        t -= dur;
      }

      return {
        imageTimelineIndex: 0,
        remainingMs: timeline[0]?.ms || 7000
      };
    }

    function activateNode(node, previousNode, useFade = false) {
      if (!node) return;

      node.classList.toggle("fade-enabled", useFade);

      const activate = () => {
        node.classList.add("active");
      };

      if (useFade) {
        requestAnimationFrame(() => {
          requestAnimationFrame(activate);
        });
      } else {
        activate();
      }

      if (previousNode && previousNode !== node) {
        previousNode.classList.remove("active");
        setTimeout(() => {
          if (previousNode.parentNode === stage) {
            previousNode.remove();
          }
        }, useFade ? 980 : 0);
      }
    }

    function detachPreviousNode() {
      const previousNode = currentNode;

      if (previousNode) {
        previousNode.onended = null;
        previousNode.onerror = null;
        previousNode.onload = null;
        previousNode.onloadeddata = null;
        previousNode.pause?.();
      }

      return previousNode;
    }

    function renderItem(item) {
      const src = cacheBustedSrc(item);
      if (currentNode?.dataset?.src === src && currentKind === item.type) {
        reportPlayerState(item);
        return { kind: currentKind, node: currentNode };
      }

      const previousNode = detachPreviousNode();
      let activated = false;
      const activateOnce = (node) => {
        if (activated) return;
        activated = true;
        activateNode(node, previousNode, transitionEnabled);
      };

      if (item.type === "image") {
        const img = document.createElement("img");
        img.className = "media-frame";
        img.dataset.src = src;
        img.onload = () => {
          activateOnce(img);
        };
        img.onerror = () => advanceSequentially();
        img.src = src;
        stage.appendChild(img);

        if (img.complete && img.naturalWidth > 0) {
          activateOnce(img);
        }

        currentNode = img;
        currentKind = "image";
        reportPlayerState(item);

        return { kind: "image", node: img };
      }

      if (item.type === "video") {
        const video = document.createElement("video");
        video.className = "media-frame";
        video.dataset.src = src;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        video.controls = false;
        video.onloadeddata = () => activateOnce(video);
        video.src = src;

        stage.appendChild(video);

        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          activateOnce(video);
        }

        currentNode = video;
        currentKind = "video";
        reportPlayerState(item);

        return { kind: "video", node: video };
      }

      currentKind = null;
      return { kind: "unknown", node: null };
    }

    function advanceSequentially() {
      if (isPaused) return;
      if (!playlist.length) return showEmpty();
      currentIndex = (currentIndex + 1) % playlist.length;
      playSequential(currentIndex);
    }

    function playSequential(i) {
      clearTimers();

      if (isPaused) return;

      if (!playlist.length) return showEmpty();

      currentIndex = i;
      const item = playlist[currentIndex];
      const rendered = renderItem(item);
      preloadItem(getNextIndex(currentIndex));
      trimPreloadCache();

      if (rendered.kind === "image") {
        nextTimer = setTimeout(() => {
          advanceSequentially();
        }, item.duration || 7000);
        return;
      }

      if (rendered.kind === "video") {
        const video = rendered.node;

        video.onended = () => {
          advanceSequentially();
        };

        video.onerror = () => {
          advanceSequentially();
        };

        video.play().catch((err) => {
          console.error("Video playback failed:", err);
          advanceSequentially();
        });

        return;
      }

      showEmpty();
    }

    function playFromSync() {
      clearTimers();

      if (isPaused) return;

      if (!Array.isArray(playlist) || playlist.length === 0) {
        return showEmpty();
      }

      // If no sync info, just start locally
      if (!syncState || !syncState.startedAt) {
        currentIndex = 0;
        playSequential(currentIndex);
        return;
      }

      const imageTimeline = buildImageTimeline();

      // If playlist is only videos, no meaningful time sync is possible
      if (imageTimeline.length === 0) {
        currentIndex = 0;
        playSequential(currentIndex);
        return;
      }

      const elapsed = Math.max(0, Date.now() - syncState.startedAt);
      const { imageTimelineIndex, remainingMs } = computeImageIndexAndRemainder(imageTimeline, elapsed);

      // Start on the synced IMAGE slot
      currentIndex = imageTimeline[imageTimelineIndex].playlistIndex;

      const item = playlist[currentIndex];
      const rendered = renderItem(item);
      preloadItem(getNextIndex(currentIndex));
      trimPreloadCache();

      if (rendered.kind === "image") {
        nextTimer = setTimeout(() => {
          advanceSequentially();
        }, remainingMs || item.duration || 7000);
        return;
      }

      // Fallback (shouldn't really happen now)
      playSequential(currentIndex);
    }

    async function init() {
      await Promise.all([fetchPlaylist(), fetchSync(), fetchSettings()]);
      isPaused = syncState?.paused === true;
      if (isPaused) {
        renderPausedFromSync();
        return;
      }
      playFromSync();
    }

    // Media/library changed: do a full re-fetch and re-sync
    socket.on("reload", async () => {
      await Promise.all([fetchPlaylist(), fetchSync(), fetchSettings()]);
      isPaused = syncState?.paused === true;
      if (isPaused) {
        renderPausedFromSync();
        return;
      }
      playFromSync();
    });

    // Soft sync update: store latest sync state, but DO NOT restart videos constantly
    socket.on("sync", (state) => {
      syncState = state;
      isPaused = syncState?.paused === true;

      if (isPaused) {
        pausePlayback();
        return;
      }

      // Optional gentle correction:
      // only re-sync while currently showing an image
      // avoid interrupting videos entirely
      if (currentKind === "image") {
        clearTimers();
        playFromSync();
      }
    });

    socket.on("playback-state", ({ paused, syncState: nextSyncState }) => {
      if (nextSyncState) syncState = nextSyncState;

      if (paused) {
        pausePlayback();
        return;
      }

      resumePlayback();
    });

    init();
  </script>
</body>
</html>
