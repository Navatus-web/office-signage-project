<!DOCTYPE html>
<html>
<head>
  <title>Office Signage Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:Arial;
      background:#111;
      color:#fff;
      margin:0;
      padding:30px;
    }

    h1{
      margin-top:0;
    }

    .card{
      background:#1c1c1c;
      padding:20px;
      border-radius:10px;
      max-width:500px;
    }

    label{
      display:block;
      margin-top:15px;
      font-size:14px;
      opacity:.8;
    }

    input{
      width:100%;
      padding:10px;
      font-size:16px;
      border-radius:6px;
      border:1px solid #333;
      background:#0f0f0f;
      color:#fff;
      margin-top:5px;
    }

    button{
      margin-top:15px;
      padding:10px 16px;
      font-size:14px;
      border:none;
      border-radius:6px;
      background:#2d7dff;
      color:white;
      cursor:pointer;
    }

    button:hover{
      background:#1e5fd1;
    }

    .danger{
      background:#ff3b3b;
    }

    .danger:hover{
      background:#c62828;
    }

    .status{
      margin-top:10px;
      font-size:13px;
      opacity:.8;
    }
  </style>
</head>

<body>

<h1>Office Signage Admin</h1>

<div class="card">

<label>Image Interval (seconds)</label>
<input id="intervalInput" type="number" min="1" max="600">

<button onclick="saveInterval()">Save Interval</button>

<button onclick="reloadScreens()">Reload Screens</button>

<form method="POST" action="/admin-logout">
  <button class="danger">Logout</button>
</form>

<div class="status" id="status"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

async function loadSettings(){

  const res = await fetch("/api/settings");

  if(res.status === 401){
    window.location="/admin-login";
    return;
  }

  const settings = await res.json();

  document.getElementById("intervalInput").value =
      settings.imageIntervalMs / 1000;
}

async function saveInterval(){

  const seconds =
    Number(document.getElementById("intervalInput").value);

  const ms = seconds * 1000;

  const res = await fetch("/api/settings",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      imageIntervalMs:ms
    })
  });

  if(res.ok){
    document.getElementById("status").innerText =
      "✔ Interval saved. Screens reloading...";
  }
  else{
    document.getElementById("status").innerText =
      "❌ Failed to update interval";
  }
}

function reloadScreens(){

  socket.emit("reload");

  document.getElementById("status").innerText =
    "Reload signal sent to all screens";
}

loadSettings();

</script>

</body>
</html>
