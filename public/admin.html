<!DOCTYPE html>
<html>
<head>
  <title>Office Signage Admin Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f172a;
      --surface: rgba(15, 23, 42, 0.88);
      --surface-strong: rgba(17, 24, 39, 0.96);
      --line: rgba(148, 163, 184, 0.22);
      --line-strong: rgba(56, 189, 248, 0.38);
      --text: #e5edf6;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --success: #34d399;
      --danger: #fb7185;
      --danger-strong: #e11d48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #111827 0%, var(--bg) 42%, #111827 100%);
      color: var(--text);
      line-height: 1.45;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .header {
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--line);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.28);
      backdrop-filter: blur(14px);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .client-count {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .panel-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--soft);
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 16px;
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.16);
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .panel:hover {
      border-color: var(--line-strong);
      background: var(--surface-strong);
      box-shadow: 0 18px 38px rgba(2, 6, 23, 0.24);
      transform: translateY(-1px);
    }

    .panel:hover::before {
      opacity: 1;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 10px 0 14px;
    }

    .health-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      background: rgba(2, 6, 23, 0.24);
    }

    .health-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .health-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--soft);
      font-size: 13px;
    }

    .toggle-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-icon {
      min-width: 42px;
      height: 26px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.08);
      color: var(--soft);
      flex: 0 0 auto;
    }

    .panel-icon svg {
      width: 15px;
      height: 15px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .panel-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    input[type="number"],
    input[type="file"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.28);
      color: var(--text);
      margin-top: 5px;
      transition: all 0.3s ease;
    }

    input[type="number"]:focus,
    input[type="file"]:focus,
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(2, 6, 23, 0.42);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    input[readonly] {
      cursor: text;
      color: var(--accent);
    }

    .copy-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    input[type="file"]::file-selector-button {
      padding: 8px 14px;
      background: var(--accent-strong);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      margin-right: 10px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
    }

    input[type="file"]::file-selector-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(14, 165, 233, 0.22);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .compact-actions {
      justify-content: flex-start;
    }

    button {
      min-height: 40px;
      padding: 9px 14px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.52);
      border-radius: 6px;
      background: rgba(14, 165, 233, 0.12);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex: 1;
      min-width: 100px;
      position: relative;
      overflow: hidden;
    }

    .compact-actions button,
    button.compact {
      flex: 0 0 auto;
      min-width: 170px;
      max-width: 240px;
    }

    button:hover {
      border-color: var(--accent);
      color: #e0f2fe;
      background: rgba(14, 165, 233, 0.22);
      box-shadow: 0 10px 22px rgba(2, 6, 23, 0.22);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .danger {
      border-color: rgba(251, 113, 133, 0.55);
      color: var(--danger);
      background: rgba(225, 29, 72, 0.12);
    }

    .danger:hover {
      border-color: var(--danger);
      color: #ffe4e6;
      background: rgba(225, 29, 72, 0.22);
      box-shadow: 0 12px 24px rgba(127, 29, 29, 0.18);
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0.95;
      display: none;
      border-left: 3px solid;
      letter-spacing: 0.01em;
    }

    .status.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 0.95;
        transform: translateY(0);
      }
    }

    .status.success {
      background: rgba(16, 185, 129, 0.12);
      border-left-color: var(--success);
      color: #a7f3d0;
    }

    .status.error {
      background: rgba(225, 29, 72, 0.12);
      border-left-color: var(--danger);
      color: #fecdd3;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .media-browser {
      margin-top: 18px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.22);
      padding: 14px;
    }

    .media-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .media-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .media-actions button {
      min-width: 104px;
      min-height: 34px;
      padding: 7px 10px;
      font-size: 10px;
      flex: 0 0 auto;
    }

    .media-heading {
      font-size: 12px;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .media-count {
      color: var(--accent);
      font-size: 11px;
      opacity: 0.9;
      margin-left: 8px;
    }

    .media-list {
      display: grid;
      gap: 6px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .media-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1.4fr) 72px 78px minmax(220px, auto) 72px;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.32);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .media-row.dragging {
      opacity: 0.45;
      border-color: var(--accent);
    }

    .media-row:hover {
      border-color: rgba(56, 189, 248, 0.24);
      background: rgba(14, 165, 233, 0.09);
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(2, 6, 23, 0.14);
    }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      font-size: 14px;
      line-height: 1;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .media-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--text);
    }

    .media-meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      opacity: 0.9;
    }

    .media-type {
      min-width: 52px;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      color: #a7f3d0;
      border: 1px solid rgba(52, 211, 153, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .media-type.video {
      color: #bae6fd;
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(14, 165, 233, 0.1);
    }

    .duration-control {
      display: grid;
      grid-template-columns: 68px auto auto;
      gap: 6px;
      align-items: center;
    }

    .duration-control input {
      margin-top: 0;
      min-height: 34px;
      padding: 6px 8px;
      font-size: 11px;
      text-align: right;
    }

    .duration-control button {
      min-width: 50px;
      min-height: 34px;
      padding: 6px 8px;
      font-size: 10px;
      flex: 0 0 auto;
    }

    .duration-note {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      opacity: 0.85;
    }

    .media-remove {
      min-width: 68px;
      min-height: 34px;
      padding: 6px 8px;
      font-size: 10px;
      flex: 0 0 auto;
    }

    .media-empty {
      padding: 14px 12px;
      border: 1px dashed rgba(148, 163, 184, 0.3);
      border-radius: 4px;
      color: var(--muted);
      font-size: 12px;
      opacity: 0.85;
    }

    .logout-panel form {
      margin: 0;
    }

    .logout-panel button {
      width: auto;
    }

    .account-stack {
      display: grid;
      gap: 16px;
    }

    .account-section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .account-section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .account-disclosure-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .account-section-toggle {
      margin-bottom: 12px;
      width: auto;
      min-width: 180px;
      justify-content: flex-start;
    }

    .account-disclosure-toggle::before {
      content: "▸";
      font-size: 12px;
      color: var(--accent);
      transition: transform 0.2s ease;
    }

    .account-disclosure-toggle.is-open::before {
      transform: rotate(90deg);
    }

    .account-disclosure-content {
      display: none;
      margin-top: 14px;
    }

    .account-disclosure-content.is-open {
      display: block;
    }

    .preview-window {
      position: relative;
      width: min(640px, 100%);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: #020617;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .preview-window img,
    .preview-window video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .preview-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .preview-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .preview-pill {
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 999px;
      padding: 4px 9px;
      color: #bae6fd;
      background: rgba(14, 165, 233, 0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @media (max-width: 900px) {
      .header {
        padding: 18px 24px;
      }

      .container {
        padding: 22px 16px 36px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .media-row {
        grid-template-columns: 18px minmax(0, 1fr) 70px auto;
      }

      .duration-control,
      .duration-note,
      .media-remove {
        grid-column: 2 / -1;
      }

      .duration-control {
        grid-template-columns: 72px auto auto;
      }
    }

    @media (max-width: 640px) {
      .header {
        padding: 16px 18px;
      }

      .header-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .status-indicator {
        gap: 12px;
        flex-wrap: wrap;
      }

      .panel {
        padding: 16px;
      }

      .copy-row {
        grid-template-columns: 1fr;
      }

      .media-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .media-actions {
        justify-content: stretch;
      }

      .media-actions button {
        flex: 1 1 120px;
      }

      .media-row {
        grid-template-columns: 18px minmax(0, 1fr) auto;
        align-items: start;
      }

      .media-meta {
        display: none;
      }

      .media-type {
        justify-self: end;
      }

      .button-group button,
      .compact-actions button,
      button.compact,
      .logout-panel button {
        width: 100%;
        max-width: none;
        min-width: 0;
      }

      .duration-control {
        grid-template-columns: minmax(0, 1fr) auto auto;
      }

      .preview-window {
        width: 100%;
      }
    }

  </style>
</head>

<body>

<div class="header">
  <div class="header-content">
    <div class="logo">Signage Control</div>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>System Online</span>
      <span class="client-count" id="clientCount">0 devices</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="panel-title">▌ Playback Management</div>
  
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect x="2.75" y="3.25" width="10.5" height="9.5" rx="1.5"></rect>
            <path d="M4.4 10.2 6.5 8.1l2.1 2.1 1.3-1.3 1.7 1.7"></path>
            <circle cx="5.3" cy="5.7" r="0.95" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <span class="panel-name">Media Upload</span>
      </div>
      <label>Select Up To 10 Media Files</label>
      <input id="fileInput" type="file" accept="image/*,video/*" multiple>
      <div class="button-group">
        <button onclick="uploadFile()">Upload</button>
        <button class="danger" onclick="confirmClearMedia()">Clear Media Folder</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel full-width">
      <div class="panel-header">
        <span class="panel-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <circle cx="8" cy="8" r="5.25"></circle>
            <path d="M8 5.2v3.1l2.2 1.5"></path>
          </svg>
        </span>
        <span class="panel-name">Interval Control</span>
      </div>
      <label>Default Overall Image Time (seconds)</label>
      <input id="intervalInput" type="number" min="1" max="600">
      <label class="toggle-row">
        <input id="transitionToggle" type="checkbox">
        <span>Fade into the next image</span>
      </label>
      <div class="button-group compact-actions">
        <button onclick="saveInterval()">Apply To All Images</button>
      </div>
      <div class="status" id="settingsStatus"></div>
      <div class="media-browser">
        <div class="media-toolbar">
          <div class="media-heading">
            Media Folder
            <span class="media-count" id="mediaCount">0 items</span>
          </div>
          <div class="media-actions">
            <button onclick="saveMediaOrder()">Save Order</button>
            <button onclick="resetMediaOrder()">Reset Order</button>
            <button onclick="loadMediaFiles()">Refresh List</button>
          </div>
        </div>
        <div class="media-list" id="mediaList">
          <div class="media-empty">Loading media folder...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="panel full-width">
      <div class="panel-header">
        <span class="panel-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect x="2.75" y="3.25" width="10.5" height="9.5" rx="1.5"></rect>
            <path d="M4.4 10.2 6.5 8.1l2.1 2.1 1.3-1.3 1.7 1.7"></path>
            <circle cx="5.3" cy="5.7" r="0.95" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <span class="panel-name">Live Preview</span>
      </div>
      <div class="media-toolbar">
        <div class="media-heading">Current Display View</div>
        <button class="compact" onclick="refreshPreview()">Refresh Preview</button>
      </div>
      <div class="preview-window" id="previewWindow">
        <div class="preview-empty">Loading preview...</div>
      </div>
      <div class="preview-meta">
        <span class="preview-pill" id="previewState">Syncing</span>
        <span id="previewName">No media loaded</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="panel full-width">
      <div class="panel-header">
        <span class="panel-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <path d="M3 11.5a5.6 5.6 0 0 1 10 0"></path>
            <path d="M5 9.2a3.5 3.5 0 0 1 6 0"></path>
            <circle cx="8" cy="12" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <span class="panel-name">Broadcast Control</span>
      </div>
      <div class="health-grid" id="healthGrid">
        <div class="health-card">
          <div class="health-label">Status</div>
          <div class="health-value" id="healthStatus">Loading…</div>
        </div>
        <div class="health-card">
          <div class="health-label">Uptime</div>

<script>

const socket = io();
const nativeFetch = window.fetch.bind(window);
let csrfTokenPromise = null;

function getCsrfToken(){
  if(!csrfTokenPromise){
    csrfTokenPromise = nativeFetch("/api/csrf-token", { cache: "no-store" })
      .then((res) => {
        if(res.status === 401){
          window.location = "/admin-login";
          return {};
        }
        return res.json();
      })
      .then((data) => data?.csrfToken || "");
  }

  return csrfTokenPromise;
}

window.fetch = async (input, init = {}) => {
  const method = String(init.method || "GET").toUpperCase();

  if(!["GET", "HEAD", "OPTIONS"].includes(method)){
    const headers = new Headers(init.headers || {});
    headers.set("X-CSRF-Token", await getCsrfToken());
    init = { ...init, headers };
  }

  return nativeFetch(input, init);
};

let screensPaused = false;
let previewPlaylist = [];
let previewSyncState = null;
let previewTimer = null;
let previewVideoTimer = null;
let previewCurrentSrc = "";

function showStatus(status, type, message){
  status.classList.remove("success", "error");
  status.classList.add("show", type);
  status.innerText = message;
  setTimeout(() => status.classList.remove("show"), 4000);
}

async function loadHealth(){
  try {
    const res = await fetch("/api/health", { cache: "no-store" });

    if (res.status === 401) {
      window.location = "/admin-login";
      return;
    }

    if (!res.ok) return;

    const data = await res.json();
    document.getElementById("healthStatus").innerText = data.paused ? "Paused" : "Running";
    document.getElementById("healthUptime").innerText = data.uptimeText || "—";
    document.getElementById("healthPlayers").innerText = `${data.connectedPlayers} player${data.connectedPlayers === 1 ? "" : "s"}`;
    document.getElementById("healthPlaylist").innerText = `${data.playlistCount} item${data.playlistCount === 1 ? "" : "s"}`;
  } catch (e) {
    document.getElementById("healthStatus").innerText = "Unavailable";
    document.getElementById("healthUptime").innerText = "—";
    document.getElementById("healthPlayers").innerText = "—";
    document.getElementById("healthPlaylist").innerText = "—";

}

function mediaNameFromSrc(src){
  const encoded = (String(src || "").split("/").pop() || "").split("?")[0];
  try {
    return decodeURIComponent(encoded);
  } catch (e) {
    return encoded;
  }
}

function clearPreviewTimers(){
  if(previewTimer) clearTimeout(previewTimer);
  if(previewVideoTimer) clearTimeout(previewVideoTimer);
  previewTimer = null;
  previewVideoTimer = null;
}

function updatePreviewStateLabel(){
  const state = document.getElementById("previewState");
  if(!state) return;
  state.innerText = screensPaused ? "Paused" : "Live";
}

function renderPreviewFromPlayerState(payload){
  if(!payload?.state?.src){
    return;
  }

  clearPreviewTimers();

  const state = payload.state;
  const label = document.getElementById("previewState");
  if(label){
    label.innerText = state.paused ? "Paused Display" : "Display Live";
  }

  const node = renderPreviewItem({
    type: state.type,
    src: state.src
  });

  if(state.paused && node?.pause){
    node.pause();
  }
}

function buildPreviewImageTimeline(){
  const timeline = [];

  previewPlaylist.forEach((item, playlistIndex) => {
    if(item.type === "image"){
      timeline.push({
        ...item,
        playlistIndex,
        ms: item.duration || 7000
      });
    }
  });

  return timeline;
}

function computePreviewImageIndexAndRemainder(timeline, elapsedMs){
  const totalMs = timeline.reduce((sum, item) => sum + item.ms, 0);

  if(totalMs <= 0){
    return { imageTimelineIndex: 0, remainingMs: null };
  }

  let t = elapsedMs % totalMs;

  for(let i = 0; i < timeline.length; i += 1){
    const duration = timeline[i].ms;
    if(t < duration){
      return {
        imageTimelineIndex: i,
        remainingMs: duration - t
      };
    }
    t -= duration;
  }

  return {
    imageTimelineIndex: 0,
    remainingMs: timeline[0]?.ms || 7000
  };
}

function renderPreviewItem(item){
  const preview = document.getElementById("previewWindow");
  const name = document.getElementById("previewName");

  if(!item){
    previewCurrentSrc = "";
    preview.innerHTML = '<div class="preview-empty">No media found.</div>';
    name.innerText = "No media loaded";
    return null;
  }

  name.innerText = mediaNameFromSrc(item.src);

  if(previewCurrentSrc === item.src){
    return preview.querySelector("img, video");
  }

  previewCurrentSrc = item.src;
  preview.innerHTML = "";

  if(item.type === "image"){
    const img = document.createElement("img");
    img.src = item.src;
    preview.appendChild(img);
    return img;
  }

  if(item.type === "video"){
    const video = document.createElement("video");
    video.src = item.src;
    video.autoplay = !screensPaused;
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.controls = false;
    preview.appendChild(video);

    if(!screensPaused){
      video.play().catch(() => {});
    }

    return video;
  }

  preview.innerHTML = '<div class="preview-empty">Unsupported media type.</div>';
  return null;
}

function renderPreviewFromSync(){
  clearPreviewTimers();
  updatePreviewStateLabel();

  if(!Array.isArray(previewPlaylist) || previewPlaylist.length === 0){
    renderPreviewItem(null);
    return;
  }

  const imageTimeline = buildPreviewImageTimeline();

  if(imageTimeline.length === 0){
    const item = previewPlaylist[0];
    const node = renderPreviewItem(item);
    if(screensPaused && node?.pause) node.pause();
    return;
  }

  const elapsed = Math.max(0, Date.now() - (previewSyncState?.startedAt || Date.now()));
  const { imageTimelineIndex, remainingMs } = computePreviewImageIndexAndRemainder(imageTimeline, elapsed);
  const item = previewPlaylist[imageTimeline[imageTimelineIndex].playlistIndex];
  const node = renderPreviewItem(item);

  if(screensPaused){
    if(node?.pause) node.pause();
    return;
  }

  if(item?.type === "image"){
    previewTimer = setTimeout(renderPreviewFromSync, remainingMs || item.duration || 7000);
  }
}

async function refreshPreview(){
  try {
    const [playlistRes, syncRes] = await Promise.all([
      fetch("/api/playlist", { cache: "no-store" }),
      fetch("/api/sync", { cache: "no-store" })

    previewPlaylist = await playlistRes.json();
    previewSyncState = await syncRes.json();
    screensPaused = previewSyncState?.paused === true;
    updatePauseButton();
    renderPreviewFromSync();
  } catch (e) {
    const preview = document.getElementById("previewWindow");
    document.getElementById("previewName").innerText = "Preview unavailable";
    preview.innerHTML = '<div class="preview-empty">Preview unavailable.</div>';
  }
}

  try {
    if(navigator.clipboard && window.isSecureContext){

function formatBytes(bytes){
  const units = ["B", "KB", "MB", "GB"];
  let size = Number(bytes) || 0;
  let unitIndex = 0;

  while(size >= 1024 && unitIndex < units.length - 1){
    size /= 1024;
    unitIndex += 1;
  }

  return `${size >= 10 || unitIndex === 0 ? Math.round(size) : size.toFixed(1)} ${units[unitIndex]}`;
}

async function saveMediaDuration(filename, value){
  const status = document.getElementById("uploadStatus");

  try {
    const res = await fetch("/api/media-duration", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({

    if(res.status === 401){

    const data = await res.json();

    if(res.ok){
      showStatus(status, "success", value ? `✓ Duration saved for ${filename}` : `✓ Duration reset for ${filename}`);
      loadMediaFiles();

    else {
      showStatus(status, "error", `✗ Duration failed: ${data.error}`);

}

  }
}

function getMediaOrderFromDom(){
  return [...document.querySelectorAll("#mediaList .media-row")]
    .map((row) => row.dataset.filename)
    .filter(Boolean);
}

function getDragAfterElement(container, y){
  const rows = [...container.querySelectorAll(".media-row:not(.dragging)")];

  return rows.reduce((closest, row) => {
    const box = row.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if(offset < 0 && offset > closest.offset){
      return { offset, element: row };
    }

    return closest;
  }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
}

function enableMediaDragSort(){
  const list = document.getElementById("mediaList");

  list.querySelectorAll(".media-row").forEach((row) => {
    row.addEventListener("dragstart", () => {
      row.classList.add("dragging");
    });

    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
    });
  });

  list.ondragover = (event) => {
    event.preventDefault();
    const dragging = list.querySelector(".dragging");
    if(!dragging) return;

    const afterElement = getDragAfterElement(list, event.clientY);
    if(afterElement){
      list.insertBefore(dragging, afterElement);
    }
    else {
      list.appendChild(dragging);
    }
  };
}

async function saveMediaOrder(){

  try {

    showStatus(status, "error", "✗ Order error: " + e.message);
  }
}

async function resetMediaOrder(){

function renderMediaFiles(files){
  const list = document.getElementById("mediaList");
  const count = document.getElementById("mediaCount");
  count.innerText = `${files.length} item${files.length === 1 ? "" : "s"}`;
  list.innerHTML = "";

  if(files.length === 0){
    const empty = document.createElement("div");
    empty.className = "media-empty";
    empty.innerText = "No media files found.";
    list.appendChild(empty);
    return;
  }

  files.forEach((file) => {
    const row = document.createElement("div");
    row.className = "media-row";
    row.draggable = true;
    row.dataset.filename = file.name;

    const handle = document.createElement("div");
    handle.className = "drag-handle";
    handle.title = "Drag to reorder";
    handle.innerText = "⋮⋮";

    const name = document.createElement("div");
    name.className = "media-name";
    name.title = file.name;
    name.innerText = file.name;

    const meta = document.createElement("div");
    meta.className = "media-meta";
    meta.innerText = formatBytes(file.size);

    const type = document.createElement("div");
    type.className = `media-type ${file.type}`;
    type.innerText = file.type;

    const duration = document.createElement("div");
    if(file.type === "image"){
      duration.className = "duration-control";

      const input = document.createElement("input");
      input.type = "number";
      input.min = "1";
      input.max = "600";
      input.placeholder = "Default";
      input.value = file.durationMs ? String(Math.round(file.durationMs / 1000)) : "";
      input.title = "Image duration in seconds. Blank uses the global interval.";

      const save = document.createElement("button");
      save.type = "button";
      save.innerText = "Save";
      save.onclick = () => saveMediaDuration(file.name, input.value);

      const reset = document.createElement("button");
      reset.type = "button";
      reset.innerText = "Reset";
      reset.onclick = () => saveMediaDuration(file.name, null);

      duration.appendChild(input);
      duration.appendChild(save);
      duration.appendChild(reset);
    }
    else {
      duration.className = "duration-note";
      duration.innerText = "Full video";
    }

    row.appendChild(handle);
    row.appendChild(name);
    row.appendChild(meta);
    row.appendChild(type);
    row.appendChild(duration);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger media-remove";
    remove.innerText = "Remove";
    remove.onclick = () => removeMediaFile(file.name);
    row.appendChild(remove);

    list.appendChild(row);
  });

  enableMediaDragSort();
}

async function loadMediaFiles(){
  const list = document.getElementById("mediaList");
  const count = document.getElementById("mediaCount");
  list.innerHTML = "";

  const loading = document.createElement("div");
  loading.className = "media-empty";
  loading.innerText = "Loading media folder...";
  list.appendChild(loading);

  try {
    const res = await fetch("/api/media");

    if(res.status === 401){
      window.location="/admin-login";
      return;
    }

    const data = await res.json();

    if(res.ok){
      renderMediaFiles(data.files || []);
    }
    else {
      count.innerText = "Unavailable";
      list.innerHTML = "";
      const error = document.createElement("div");
      error.className = "media-empty";
      error.innerText = `Failed to load media: ${data.error}`;
      list.appendChild(error);
    }
  } catch (e) {
    count.innerText = "Unavailable";
    list.innerHTML = "";
    const error = document.createElement("div");
    error.className = "media-empty";
    error.innerText = `Failed to load media: ${e.message}`;
    list.appendChild(error);
  }
}

async function loadSettings(){
  const res = await fetch("/api/settings");

  if(res.status === 401){
    window.location="/admin-login";
    return;
  }

  const settings = await res.json();
  document.getElementById("intervalInput").value = settings.imageIntervalMs / 1000;
  document.getElementById("transitionToggle").checked = settings.imageTransitionEnabled === true;
}

async function saveInterval(){
  const seconds = Number(document.getElementById("intervalInput").value);
  const ms = seconds * 1000;
  const transitionEnabled = document.getElementById("transitionToggle").checked;

  const res = await fetch("/api/settings",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      imageIntervalMs:ms,
      imageTransitionEnabled: transitionEnabled
    })
  });

  const status = document.getElementById("settingsStatus");
  if(res.ok){
    showStatus(status, "success", "✓ Default time applied to all images. Synchronizing screens...");
    loadMediaFiles();
    refreshPreview();
  }
  else{
    showStatus(status, "error", "✗ Failed to apply default time");
  }
}

async function uploadFile(){
  const fileInput = document.getElementById("fileInput");
  const files = [...fileInput.files];
  const status = document.getElementById("uploadStatus");

  if(files.length === 0){
    showStatus(status, "error", "✗ No files selected");
    return;
  }

  if(files.length > 10){
    showStatus(status, "error", "✗ Maximum 10 files per upload");
    return;
  }

  const formData = new FormData();
  files.forEach((file) => {
    formData.append("files", file);
  });

  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      body: formData
    });

    if(res.ok){
      const data = await res.json();
      showStatus(status, "success", `✓ Uploaded ${data.count} file${data.count === 1 ? "" : "s"}`);
      fileInput.value = "";
      loadMediaFiles();
      refreshPreview();
    }
    else {
      const err = await res.json();
      showStatus(status, "error", `✗ Upload failed: ${err.error}`);
    }
  } catch (e) {
    showStatus(status, "error", "✗ Upload error: " + e.message);
  }
}

async function confirmClearMedia(){
  const status = document.getElementById("uploadStatus");
  const confirmed = window.confirm("Clear every file from the media folder? This cannot be undone.");

  if(!confirmed){
    return;
  }

  status.classList.remove("success", "error");
  status.classList.add("show");
  status.innerText = "Clearing media folder...";

  try {
    const res = await fetch("/api/media", {
      method: "DELETE"
    });

    const data = await res.json();

    if(res.ok){
      showStatus(status, "success", `✓ Media folder cleared. Removed ${data.deletedCount} item${data.deletedCount === 1 ? "" : "s"}.`);
      document.getElementById("fileInput").value = "";
      loadMediaFiles();
    }
    else {
      showStatus(status, "error", `✗ Clear failed: ${data.error}`);
    }
  } catch (e) {
    showStatus(status, "error", "✗ Clear error: " + e.message);
  }
}

function reloadScreens(){

  const status = document.getElementById("reloadStatus");
  showStatus(status, "success", "✓ Reload signal broadcast to all displays");
  refreshPreview();
}

function togglePauseScreens(){
  screensPaused = !screensPaused;
  socket.emit("set-paused", screensPaused);
  updatePauseButton();

  const status = document.getElementById("reloadStatus");
  showStatus(status, "success", screensPaused ? "✓ Displays paused" : "✓ Displays resumed");
}

socket.on("client-count", (count) => {
  document.getElementById("clientCount").innerText = `${count} device${count === 1 ? "" : "s"} connected`;
});

socket.on("playback-state", ({ paused }) => {
  screensPaused = paused === true;
  updatePauseButton();
  renderPreviewFromSync();
});

socket.on("player-state", (payload) => {
  renderPreviewFromPlayerState(payload);
});

socket.on("reload", () => {
  refreshPreview();
});

socket.on("sync", (state) => {
  previewSyncState = state;
  screensPaused = state?.paused === true;
  updatePauseButton();
  renderPreviewFromSync();
});

loadSettings();
loadMediaFiles();
setPlayerUrl();
loadPlaybackState();
loadHealth();
refreshPreview();
setInterval(loadHealth, 10000);

</script>

</body>
</html>
