<!DOCTYPE html>
<html>
<head>
  <title>Office Signage Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body{
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color:#fff;
      margin:0;
      padding:40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1{
      margin: 0 0 30px 0;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(120deg, #2d7dff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card{
      background: rgba(28, 28, 28, 0.8);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(45, 125, 255, 0.3);
      background: rgba(28, 28, 28, 0.95);
    }

    .card h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00d4ff;
    }

    label{
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }

    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 15, 15, 0.7);
      color: #fff;
      margin-top: 5px;
      transition: all 0.3s ease;
    }

    input[type="number"]:focus,
    input[type="file"]:focus {
      outline: none;
      border-color: #2d7dff;
      background: rgba(15, 15, 15, 0.9);
      box-shadow: 0 0 0 3px rgba(45, 125, 255, 0.1);
    }

    input[type="file"]::file-selector-button {
      padding: 8px 16px;
      background: #2d7dff;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      margin-right: 10px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: #1e5fd1;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button{
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #2d7dff;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 120px;
    }

    button:hover{
      background: #1e5fd1;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(45, 125, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .danger{
      background: #ff3b3b;
      flex: none;
      width: 100%;
    }

    .danger:hover{
      background: #c62828;
      box-shadow: 0 8px 16px rgba(255, 59, 59, 0.3);
    }

    .status{
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0.95;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(76, 175, 80, 0.2);
      border-left: 3px solid #4caf50;
      color: #90ee90;
    }

    .status.error {
      background: rgba(255, 59, 59, 0.2);
      border-left: 3px solid #ff3b3b;
      color: #ff8888;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Office Signage Admin</h1>

  <div class="grid">
    <div class="card">
      <h2>⏱️ Playback Settings</h2>
      <label>Image Interval (seconds)</label>
      <input id="intervalInput" type="number" min="1" max="600">
      <div class="button-group">
        <button onclick="saveInterval()">Save Interval</button>
      </div>
      <div class="status" id="settingsStatus"></div>
    </div>

    <div class="card">
      <h2>📤 Upload Media</h2>
      <label>Select file to upload</label>
      <input id="fileInput" type="file" accept="image/*,video/*">
      <div class="button-group">
        <button onclick="uploadFile()">Upload</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 30px;">
    <h2>📡 Screen Control</h2>
    <button onclick="reloadScreens()" style="flex: none; width: 100%;">Reload All Screens</button>
    <div class="status" id="reloadStatus"></div>
  </div>

  <div class="card">
    <form method="POST" action="/admin-logout" style="margin: 0;">
      <button class="danger">Logout</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

async function loadSettings(){
  const res = await fetch("/api/settings");

  if(res.status === 401){
    window.location="/admin-login";
    return;
  }

  const settings = await res.json();
  document.getElementById("intervalInput").value = settings.imageIntervalMs / 1000;
}

async function saveInterval(){
  const seconds = Number(document.getElementById("intervalInput").value);
  const ms = seconds * 1000;

  const res = await fetch("/api/settings",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      imageIntervalMs:ms
    })
  });

  const status = document.getElementById("settingsStatus");
  if(res.ok){
    status.classList.add("show", "success");
    status.innerText = "✔ Interval saved. Screens reloading...";
    setTimeout(() => status.classList.remove("show"), 3000);
  }
  else{
    status.classList.add("show", "error");
    status.innerText = "❌ Failed to update interval";
    setTimeout(() => status.classList.remove("show"), 3000);
  }
}

async function uploadFile(){
  const fileInput = document.getElementById("fileInput");
  const file = fileInput.files[0];
  const status = document.getElementById("uploadStatus");

  if(!file){
    status.classList.add("show", "error");
    status.innerText = "❌ Please select a file";
    setTimeout(() => status.classList.remove("show"), 3000);
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      body: formData
    });

    if(res.ok){
      const data = await res.json();
      status.classList.add("show", "success");
      status.innerText = `✔ Uploaded: ${data.filename}`;
      fileInput.value = "";
      setTimeout(() => status.classList.remove("show"), 3000);
    }
    else {
      const err = await res.json();
      status.classList.add("show", "error");
      status.innerText = `❌ Upload failed: ${err.error}`;
      setTimeout(() => status.classList.remove("show"), 3000);
    }
  } catch (e) {
    status.classList.add("show", "error");
    status.innerText = "❌ Upload error: " + e.message;
    setTimeout(() => status.classList.remove("show"), 3000);
  }
}

function reloadScreens(){
  socket.emit("reload");
  const status = document.getElementById("reloadStatus");
  status.classList.add("show", "success");
  status.innerText = "📡 Reload signal sent to all screens";
  setTimeout(() => status.classList.remove("show"), 3000);
}

loadSettings();

</script>

</body>
</html>
